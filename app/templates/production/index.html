{% extends "base.html" %}
{% block content %}
<h1>Production Entries</h1>
<a href="{{ url_for('production.create') }}">New Entry</a>
<ul>
  {% for entry in entries %}
    <li>Entry #{{ entry.id }} - {{ entry.status }}
      <form action="{{ url_for('production.validate', entry_id=entry.id) }}" method="post" style="display:inline;">
        <button type="submit">Validate</button>
      </form>
    </li>
  {% endfor %}
</ul>
{% endblock %}
