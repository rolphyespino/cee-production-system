{% extends "base.html" %}
{% block content %}
<h1>Catalog</h1>
<a href="{{ url_for('catalog.create') }}">New Item</a>
<ul>
  {% for item in items %}
    <li>{{ item.code }} - {{ item.name }} ({{ item.item_type }})
      {% if item.item_type == 'GARMENT' %}
        <a href="{{ url_for('catalog.piece_rates', catalog_item_id=item.id) }}">Piece Rates</a>
      {% endif %}
    </li>
  {% endfor %}
</ul>
{% endblock %}
