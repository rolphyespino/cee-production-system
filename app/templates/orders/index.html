{% extends "base.html" %}
{% block content %}
<h1>Orders</h1>
<a href="{{ url_for('orders.create') }}">New Order</a>
<ul>
  {% for order in orders %}
    <li>Order #{{ order.id }} - {{ order.status }}
      <form action="{{ url_for('orders.confirm', order_id=order.id) }}" method="post" style="display:inline;">
        <button type="submit">Confirm</button>
      </form>
      <a href="{{ url_for('orders.lines_placeholder', order_id=order.id) }}">Lines</a>
      <a href="{{ url_for('orders.change_requests', order_id=order.id) }}">Change Requests</a>
    </li>
  {% endfor %}
</ul>
{% endblock %}
